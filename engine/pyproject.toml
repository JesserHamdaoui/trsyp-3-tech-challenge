[project]
name = "rehab-engine"
version = "0.1.0"
description = "Game-agnostic sensor/CV middleware: ingest, feature extraction, reference models, deviation scoring, trend tracking, aggregation, adaptation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "supabase>=2.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
